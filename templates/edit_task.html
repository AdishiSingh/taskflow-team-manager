{% extends "base.html" %}

{% block title %}Edit Task - TaskFlow{% endblock %}

{% block content %}
<div class="form-card-wide">
    <div class="page-header mb-4">
        <div>
            <span class="page-badge">{{ project.name }}</span>
            <h1 class="page-title">Edit Task</h1>
            <p class="page-subtitle">{{ task.title }}</p>
        </div>
        <a href="{{ url_for('project.detail', project_id=project.id) }}" class="btn btn-outline-modern btn-sm">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
    
    <div class="card-modern">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('task.edit', task_id=task.id) }}">
                <div class="mb-3">
                    <label for="title" class="form-label">Task Title</label>
                    <div class="input-group-modern">
                        <span class="input-icon"><i class="bi bi-card-text"></i></span>
                        <input type="text" class="form-control" id="title" name="title" 
                               value="{{ title if title else task.title }}" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3">{{ description if description else task.description or '' }}</textarea>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Pending" {% if (status or task.status) == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="In Progress" {% if (status or task.status) == 'In Progress' %}selected{% endif %}>In Progress</option>
                            <option value="Completed" {% if (status or task.status) == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="priority" class="form-label">Priority</label>
                        <select class="form-select" id="priority" name="priority">
                            <option value="Low" {% if (priority or task.priority) == 'Low' %}selected{% endif %}>Low</option>
                            <option value="Medium" {% if (priority or task.priority) == 'Medium' %}selected{% endif %}>Medium</option>
                            <option value="High" {% if (priority or task.priority) == 'High' %}selected{% endif %}>High</option>
                        </select>
                    </div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="due_date" class="form-label">Due Date</label>
                        <input type="date" class="form-control" id="due_date" name="due_date" 
                               value="{{ due_date if due_date else (task.due_date.strftime('%Y-%m-%d') if task.due_date else '') }}">
                    </div>
                    <div class="col-md-6">
                        <label for="assigned_to" class="form-label">Assign To</label>
                        <select class="form-select" id="assigned_to" name="assigned_to">
                            <option value="">Unassigned</option>
                            {% for member in members %}
                            <option value="{{ member.id }}" {% if task.assigned_to == member.id %}selected{% endif %}>{{ member.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-modern"><i class="bi bi-check-lg"></i> Update Task</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
