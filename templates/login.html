{% extends "base.html" %}

{% block title %}Login - TaskFlow{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="form-card py-4">
    <div class="auth-card">
        <div class="auth-card-header">
            <span class="brand-icon d-inline-flex mb-3" style="width:48px;height:48px;border-radius:12px;"><i class="bi bi-kanban-fill"></i></span>
            <h2>Welcome back</h2>
            <p class="mb-0 opacity-75 small">Sign in to your workspace</p>
        </div>
        <div class="auth-card-body">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group-modern">
                        <span class="input-icon"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" 
                               value="{{ email if email else '' }}" placeholder="you@company.com" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group-modern">
                        <span class="input-icon"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-modern w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>
            </form>
            <p class="text-center text-muted small mt-4 mb-0">
                Don't have an account? <a href="{{ url_for('auth.signup') }}" class="fw-semibold">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
